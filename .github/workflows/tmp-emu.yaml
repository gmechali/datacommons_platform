name: tmp-emu
on: push
permissions:
  contents: read
jobs:
  emulated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: docker pull gcr.io/datcom-ci/datacommons-data@sha256:707701e463029d77218cbafdd51e5a30f2d6833d50f73996ae50aa9bc2472abe
      - run: uv run python tests/integration/run_e2e_tests.py --instance=emulated --test-config=foobar_wages
        env:
          PROCESSOR_IMAGE: gcr.io/datcom-ci/datacommons-data@sha256:707701e463029d77218cbafdd51e5a30f2d6833d50f73996ae50aa9bc2472abe
